<figure class="guide-shot">
  <div class="guide-shot-frame">
    <img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}" loading="lazy">
    {{ with .Get "x" }}<span class="guide-shot-highlight" style="--shot-x: {{ . }}; --shot-y: {{ $.Get "y" }}; --shot-width: {{ $.Get "width" }}; --shot-height: {{ $.Get "height" }};" aria-hidden="true"></span>{{ end }}
  </div>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
